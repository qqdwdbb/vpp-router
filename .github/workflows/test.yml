name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/unit

  go:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - deploy/fakeip/cache-migrate
          - tools/gate-admin
          - tools/vpp-egress-gate
          - tools/vpp-firewall
          - tools/vpp-interfaces
          - tools/vpp-monitor
          - tools/vpp-proxy
          - tools/vpp-system
          - tools/vpp-wireguard
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go vet ./...
      - run: go test ./...
