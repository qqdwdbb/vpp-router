# vpp-router-install.sh 读取的平台描述（bash 语法）。
# 当一块非 PCI 网卡同时满足 MACHINE、DEVICE、IFNAME 时，用本平台的原生 PMD 接入 VPP。

PLAT_TITLE="Phicomm N1 DWMAC 原生 PMD"
PLAT_ARCH=aarch64
# /proc/device-tree/compatible 中必须包含
PLAT_MACHINE=phicomm,n1
# 网卡所属平台设备 of_node/compatible 中必须包含
PLAT_DEVICE=snps,dwmac-3.70a
# helper 按名字找网卡
PLAT_IFNAME=eth0

# dpdk/ 复制为 DPDK 的 drivers/net/$PLAT_PMD，kmod/n1_dma.h 一并复制
PLAT_PMD=n1_dwmac
PLAT_VDEV=net_n1_dwmac0
# kmod/ 针对当前内核编译；modinfo 的 n1_dma_abi 必须等于 PLAT_KMOD_ABI
PLAT_KMOD=n1_dma
PLAT_KMOD_ABI=3
PLAT_VPP_SERIES=vpp-patches/series

# 统计回调与 worker 并发调用 tx_clean 会崩溃，只能单线程
PLAT_MAX_WORKERS=0
# helper 自己固定 DMA 页面，不用大页
PLAT_DPDK_ARGS=(no-hugetlb "iova-mode va" no-multi-seg enable-tcp-udp-checksum)
PLAT_DEV_ARGS="num-rx-queues 1 num-tx-queues 1 num-rx-desc 256 num-tx-desc 256"
PLAT_RX_INTERRUPTS=1
PLAT_BUFFERS="buffers-per-numa 8192 default data-size 2048 page-size default"
