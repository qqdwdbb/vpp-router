# EI inside mapping domains: WAN=0, WireGuard client egress=101.
ip table add 101
create loopback interface instance 101
set interface ip table loop101 101
set interface state loop101 up
# Reverse NAT selects the inside FIB; return through the normal routing table.
ip route add 0.0.0.0/0 table 101 via ip4-lookup-in-table 0
nat44 ei output-chain host-vpp-wan
