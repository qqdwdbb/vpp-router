# Dedicated config: kernel-vpp is mandatory, never silently use Linux IPsec.
charon {
    load_modular = no
 load = random nonce x509 revocation constraints pubkey pkcs1 pkcs8 pem openssl gmp hmac kdf attr curl kernel-vpp! kernel-netlink socket-default stroke eap-identity eap-mschapv2 updown counters
    install_routes = no
    plugins {
        kernel-vpp {
            read_timeout = 5000
            use_tunnel_mode_sa = yes
        }
        openssl {
            load_legacy = yes
        }
    }
    filelog {
        vpp {
            path = /var/log/strongswan-vpp.log
            default = 1
            flush_line = yes
            append = yes
        }
    }
}
