.m{fill:#6b788d}.b{font-weight:600}
.box{fill:#fff;stroke:#d5dde9}
.lg{fill:none;stroke:#6b788d;stroke-width:2;marker-end:url(#mg)}
.lb{fill:none;stroke:#3b6fd8;stroke-width:2.2;marker-end:url(#mb)}
.lp{fill:none;stroke:#8a5cc9;stroke-width:2.2;marker-end:url(#mp)}
.lt{fill:none;stroke:#138a7e;stroke-width:2.2;marker-end:url(#mt)}
.lh{fill:none;stroke:#2f9e6e;stroke-width:2.2;marker-start:url(#mh);marker-end:url(#mh)}
.l1{fill:none;stroke:#2f9e6e;stroke-width:2.2;marker-end:url(#mh)}
.lo{fill:none;stroke:#e07b1a;stroke-width:2.4;stroke-dasharray:7 4;marker-end:url(#mo)}
.badge{fill:#e07b1a}.bt{fill:#fff;font-size:12px;font-weight:700}
.port{fill:#33415c}
.pill{fill:#fff;stroke-width:1.6}
</style>
</defs>
<rect width="1440" height="1240" rx="16" fill="#fff"/>

<!-- ============ header ============ -->
<text x="40" y="44" font-size="12" class="m b" letter-spacing="2">VPP SOFTWARE ROUTER · 逻辑拓扑</text>
<text x="40" y="84" font-size="28" class="b">Gate 解析 DNS，按目的域名和 IP 决定路由</text>
<text x="40" y="114" font-size="14" class="m">路由器里 VPP 和 Linux 的接口、路由和 Gate。port0 和 port0.100 是同一个网口的不打标签部分和 VLAN 100，接线见物理拓扑。地址均为示例。</text>
<text x="40" y="138" font-size="14" class="m">示例分流：example.org 走 VPP 里的 WireGuard，example.net 走 sing-box 代理，corp.example 走 Linux 上的 OpenVPN（VPP 不支持的协议），其余直接上网。</text>

<g transform="translate(0,20)">
