<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
<title id="title">VPP 软路由的逻辑拓扑：Gate 解析 DNS，按目的域名和 IP 决定路由</title>
<desc id="desc">示例网络：局域网 10.61.30.0/24 经 VPP 软路由上网。Gate 在 Linux 上接收局域网的 DNS 查询，命中规则时先经 Binary API 在 VPP 写入目的地址路由，确认后才返回应答，客户端随后的连接走 WireGuard 隧道、sing-box 代理或 Linux 上的 OpenVPN，其余流量经 NAT44 从光猫上网。</desc>
<defs>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#6b788d" stroke-width="1.6"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#3b6fd8" stroke-width="1.6"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#8a5cc9" stroke-width="1.6"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#138a7e" stroke-width="1.6"/></marker>
<marker id="mh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#2f9e6e" stroke-width="1.6"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#e07b1a" stroke-width="1.8"/></marker>
<style>
