<rect x="566" y="404" width="382" height="30" rx="6" fill="#f2ecfa"/>
<text x="578" y="424" class="mono b" style="fill:#6c43a8">198.18.0.0/15</text><text x="712" y="424" class="mono" style="fill:#6c43a8">gate-tproxy</text><text x="940" y="424" text-anchor="end" style="fill:#6c43a8">Fake-IP 池</text>
</g>
<text x="572" y="458" font-size="11" class="m">最长前缀匹配：命中 /32 的走对应出口，其余走默认路由</text>

