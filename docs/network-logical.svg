<text x="578" y="322" class="mono">10.61.30.0/24</text><text x="712" y="322" class="mono">loop0</text><text x="948" y="322" class="m" text-anchor="end">局域网</text>
<rect x="566" y="336" width="382" height="30" rx="6" fill="#e9f0fd"/>
