<!-- Gate -->
<rect x="376" y="596" width="368" height="262" rx="12" fill="#fff8f0" stroke="#e9a463" stroke-width="2"/>
<text x="394" y="626" font-size="20" class="b" style="fill:#c4620c">Gate</text>
<text x="450" y="626" font-size="12" class="mono m">vpp-egress-gate</text>
<text x="394" y="650" font-size="12" class="m">监听</text>
<text x="422" y="650" font-size="12" class="mono">10.61.30.2:1053</text>
<text x="534" y="650" font-size="12" class="m">，lan0 的 53 端口重定向到这里</text>
<path d="M392 664H728" stroke="#f1d8bf"/>
<text x="394" y="688" font-size="13" class="b">分流规则</text><text x="456" y="688" font-size="12" class="m">按目的域名或目的 IP / 网段</text>
<g font-size="12">
<rect x="394" y="701" width="10" height="10" rx="2" fill="#3b6fd8"/>
<text x="412" y="711" class="mono">example.org</text><text x="524" y="711" class="m">→ VPP 隧道</text><text x="604" y="711" class="mono">wg1 via 10.62.30.1</text>
<rect x="394" y="727" width="10" height="10" rx="2" fill="#138a7e"/>
<text x="412" y="737" class="mono">corp.example</text><text x="524" y="737" class="m">→ Linux 出口</text><text x="604" y="737" class="mono">tap-tun0 → tun0</text>
<rect x="394" y="753" width="10" height="10" rx="2" fill="#8a5cc9"/>
<text x="412" y="763" class="mono">example.net</text><text x="524" y="763" class="m">→ 代理</text><text x="604" y="763" class="mono">gate-tproxy</text>
<rect x="394" y="779" width="10" height="10" rx="2" fill="#9aa6b8"/>
<text x="412" y="789" class="m">其他域名</text><text x="524" y="789" class="m">→ 只转发应答，走默认路由</text>
</g>
<path d="M392 804H728" stroke="#f1d8bf"/>
<text x="394" y="826" font-size="12" class="m">按 IP / 网段的规则直接写入路由表，不经过 DNS；</text>
<text x="394" y="846" font-size="12" class="m">域名路由闲置过期后撤掉；VPP 重启后自动重新下发。</text>

<!-- Gate -> VPP FIB via Binary API -->
<path d="M664 596V474" class="lo"/>
<text x="674" y="494" font-size="12" class="b" style="fill:#c4620c">Binary API</text>

<!-- Linux exits -->
<rect x="762" y="596" width="140" height="110" rx="10" class="box" style="stroke:#8a5cc9;stroke-width:1.6"/>
<text x="776" y="622" font-size="15" class="b">sing-box</text>
<text x="776" y="646" font-size="12" class="m">透明代理</text>
<text x="776" y="668" font-size="11" class="mono m">TPROXY :2082</text>
<text x="776" y="688" font-size="11" class="mono m">Fake-IP DNS :5354</text>
<rect x="916" y="596" width="162" height="110" rx="10" class="box" style="stroke:#138a7e;stroke-width:1.6"/>
<text x="930" y="622" font-size="15" class="b mono">tun0</text>
<text x="972" y="622" font-size="12" class="m">OpenVPN 客户端</text>
<text x="930" y="646" font-size="12" class="m">连公司网络</text>
<text x="930" y="668" font-size="11" class="mono m">masquerade</text>
<text x="930" y="688" font-size="11" class="m">VPP 不支持的协议走这里</text>
<text x="762" y="732" font-size="12" class="m">两者自己的出站连接经 lan0 回到 VPP，</text>
<text x="762" y="750" font-size="12" class="m">再由 port0.100 发往代理和 OpenVPN 服务器。</text>
<text x="762" y="776" font-size="12" class="m">每个 Linux 出口一个持久 TAP，由 Gate 创建，</text>
<text x="762" y="794" font-size="12" class="m">VPP 重启时 Linux 这端不受影响。</text>

<!-- other Linux services -->
<rect x="376" y="884" width="176" height="84" rx="10" class="box"/>
