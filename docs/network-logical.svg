<text x="40" y="1046" font-size="13" class="b">示例：笔记本打开 example.org</text>
<g font-size="13">
<circle cx="52" cy="1072" r="10" class="badge"/><text x="52" y="1076" class="bt" text-anchor="middle">1</text>
<text x="72" y="1077">笔记本向 10.61.30.1 查询 example.org。查询经 bd1 和 vpp-host 到达 lan0，被重定向给 Gate；发往 8.8.8.8 等公网 DNS 的由 ABF 送来。</text>
<circle cx="52" cy="1098" r="10" class="badge"/><text x="52" y="1102" class="bt" text-anchor="middle">2</text>
<text x="72" y="1103">Gate 向上游解析，得到 203.0.113.10，命中规则 example.org → wg1。</text>
<circle cx="52" cy="1124" r="10" class="badge"/><text x="52" y="1128" class="bt" text-anchor="middle">3</text>
<text x="72" y="1129">Gate 经 Binary API 写入 203.0.113.10/32 via 10.62.30.1 wg1，确认生效；写入失败就返回 SERVFAIL，不放出应答。</text>
<circle cx="52" cy="1150" r="10" class="badge"/><text x="52" y="1154" class="bt" text-anchor="middle">4</text>
<text x="72" y="1155">路由生效后，Gate 才把应答发回笔记本。</text>
<circle cx="52" cy="1176" r="10" class="badge"/><text x="52" y="1180" class="bt" text-anchor="middle">5</text>
<text x="72" y="1181">笔记本连接 203.0.113.10，第一个包就命中这条 /32，经 wg1 加密后从 port0.100 发往 VPS。example.net 解析成 Fake-IP，地址池路由启动时已装好。</text>
</g>

<g font-size="12">
<path d="M1130 1042H1166" class="lb"/><text x="1176" y="1046">VPP 隧道（wg1）</text>
<path d="M1130 1066H1166" class="lp"/><text x="1176" y="1070">代理（gate-tproxy）</text>
<path d="M1130 1090H1166" class="lt"/><text x="1176" y="1094">Linux 出口（tap-tun0）</text>
<path d="M1130 1114H1166" class="lg"/><text x="1176" y="1118">默认路由、LAN</text>
<path d="M1130 1138H1166" class="l1"/><text x="1176" y="1142">vpp-host：Linux 局域网口的流量</text>
<path d="M1130 1162H1166" class="lo"/><text x="1176" y="1166">Gate 经 Binary API 写路由</text>
<rect x="1128" y="1176" width="40" height="18" rx="9" fill="#fff" stroke="#6b788d" stroke-width="1.4"/><text x="1176" y="1190">TAP：VPP 与 Linux 之间的虚拟网线</text>
</g>
</g>
</svg>
