user nginx;
worker_processes 1;
daemon off;
master_process on;
pid /run/nginx-hoststack.pid;
error_log /var/log/nginx-hoststack/error.log notice;

events {
    use epoll;
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile off;
    gzip off;

    # Match VCL rx-fifo-size so each unbuffered POST read can drain a
    # full fifo chunk into one writev to the Go unix socket.
    client_body_buffer_size 1m;
    client_body_in_file_only off;

    # Go backend is Linux unix HTTP. LDP does not wrap Go syscalls, so
    # client TCP stays on Host Stack nginx and this hop is local.
    upstream librespeed_go {
        server unix:/run/librespeed-go/http.sock;
        keepalive 8;
    }

    server {
        listen 10.61.20.1:80;
        server_name 10.61.20.1;

        root /var/www/speedtest;
        index index.html index.htm;

        location = /backend/empty.php {
            client_max_body_size 128m;
            proxy_pass http://librespeed_go;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location ^~ /backend/ {
            proxy_pass http://librespeed_go;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        location ^~ /results/ {
            proxy_pass http://librespeed_go;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
