# Include inside the existing LibreSpeed server block, before regex locations.
# Proxy PHP-compatible backend URLs to librespeed-go on a Unix socket.
# Prefer an upstream { keepalive } in the parent http block; this include
# only sets per-location proxy behaviour.
location = /backend/empty.php {
    client_max_body_size 128m;
    client_body_buffer_size 1m;
    client_body_in_file_only off;
    proxy_pass http://unix:/run/librespeed-go/http.sock;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_buffering off;
}

location ^~ /backend/ {
    proxy_pass http://unix:/run/librespeed-go/http.sock;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    gzip off;
}

location ^~ /results/ {
    proxy_pass http://unix:/run/librespeed-go/http.sock;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}
