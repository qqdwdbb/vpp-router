# NAT context for the VPN exit; independent of the tunnel, which vpp-wireguard creates later.
ip table add 101
create loopback interface instance 101
set interface ip table loop101 101
set interface state loop101 up
# Reverse-NAT returns to the normal LAN routing table.
ip route add 0.0.0.0/0 table 101 via ip4-lookup-in-table 0
